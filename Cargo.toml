[package]
name = "mat-o-viewer"
version = "0.3.0"
edition = "2021"
description = "A modern terminal file viewer combining cat, less, and grep with syntax highlighting and markdown rendering"
license = "MIT"
authors = ["lelloman"]
repository = "https://github.com/lelloman/mat"
homepage = "https://github.com/lelloman/mat"
keywords = ["cli", "terminal", "cat", "less", "pager"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
rust-version = "1.88"

[[bin]]
name = "mat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "dump-load", "regex-fancy"] }
pulldown-cmark = "0.13"
terminal-light = "1.9"
regex = "1.13"
thiserror = "2"
unicode-width = "0.2"
unicode-segmentation = "1.12"
encoding_rs = "0.8"
notify = "8.2"

[build-dependencies]
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "yaml-load", "dump-create", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[profile.release]
strip = true
lto = "thin"
